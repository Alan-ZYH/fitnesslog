<h1>健身日誌（FitnessLog）</h1>
<p>健身日誌是一款個人使用的 iPhone 健身紀錄 App，用來記錄每次訓練的器材、重量、次數與組數。</p>
<p>App 可選擇把訓練紀錄備份到使用者自己的 Google 雲端硬碟。</p>
<p><a href="privacy.html">隱私權政策 Privacy Policy</a> ・ <a href="terms.html">服務條款 Terms of Service</a></p>
<hr><p lang="en">FitnessLog is a personal iPhone workout log. It can optionally back up workout records to the user's own Google Drive.</p>
